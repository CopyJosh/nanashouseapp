  <head>

    <script src="https://code.jquery.com/jquery-3.7.1.slim.min.js" integrity="sha384-5AkRS45j4ukf+JbWAfHL8P4onPA9p0KwwP7pUdjSQA3ss9edbJUJc/XcYAiheSSz" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>

    <style>
      input[type=number]::-webkit-inner-spin-button, 
      input[type=number]::-webkit-outer-spin-button { 
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        margin: 0; 
      }
      .timeheader{
        padding-left: 5%;
        padding-right: 5%;
        padding-top: 3%;
        padding-bottom: 3%;
        margin-top: 5%;
        margin-left: 5%;
        margin-right: 5%;
        border-radius: 25px;
        background: rgba(66, 217, 244, 0.50); /* COLOR CHANGE */
        text-align: center;
      }
      .checkin{
        padding-left: 5%;
        padding-right: 5%;
        padding-top: 5%;
        padding-bottom: 5%;
        margin-top: 3%;
        margin-left: 5%;
        margin-right: 5%;
        border-radius: 25px;
        background: rgba(66, 217, 244, 0.50); /* COLOR CHANGE */
        text-align: center;
      }
      .nameList {
        padding-left: 15%;
        padding-right: 15%;
        padding-top: 15%;
        padding-bottom: 15%;
        margin-top: 3%;
        margin-left: 5%;
        margin-right: 5%;
        margin-bottom: 5%;
        border-radius: 25px;
        background: rgba(117,117,117, 0.50);
        text-align: center;
      }
      h1 {
        font-family: Georgia, serif;
        font-size: 80px;
      }
      h2 {
        font-family: Georgia,sans-serif;
        font-size: 20px;
      }
      .tab-content {
        border-left: 1px solid #ddd;
        border-right: 1px solid #ddd;
        border-bottom: 1px solid #ddd;
        padding: 10px;
      }
      .nav-tabs {
        margin-bottom: 0;
      }
      .flexy {
        display: flex;
      }
      .checkinform {
        /* margin-left: 10%;
        margin-right:10%; */
        padding-left: 5%;
        border-radius: 50%;
        float: left;
        height: 20px;
        width: 300px;
        flex: auto;
      }
      .modal-button {
        flex: 0 1 0%;
        margin: auto 5%;
      }
      .background {
        background-color: #5d6060;
      }
    </style>
  </head>
  <body class="background">
    <body>
      <div class="container">
        <div class="timeheader">
          <p>
          <h1 id="time">10:45 pm</h1>
          <h2 id="date">Monday, April 13th</h2>
          </p>
      </div>
      </div>
  </body>
  <body>
    <div class="container">
      <div class="checkin">
        <h2><p> Withdrawl </p></h2>
      </div>
    </div>
  </body>
  <br>
  <div class="container flexy">
    <div class="checkinform">
      <input class="form-control" type="number" placeholder="Enter Amount" id="inputSpent">
    </div>
    <button type="button" class="btn btn-primary modal-button" data-toggle="modal" data-target="#exampleModal" id="addExpense">
      Add Expense
    </button>
  </div>
  <!-- Modal -->
  <div class="modal" id="exampleModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Things Add Up!</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <table class="table table-bordered">
            <thead>
              <tr>
                <th>Today</th>
                <th>Weekly</th>
                <th>Monthly</th>
                <th>6 Months</th>
                <th>Yearly</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <th scope="row">1</th>
                <tbody>
                </tbody> <!--calculations added here from js-->
              </tr>
            </tbody>
          </table>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary">Submit</button> <!-- add in close option when emp is checked in-->
        </div>
      </div>
    </div>
  </div>
  </body>
</html>
